<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigilblade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09080b;--panel:#121016;--panel2:#18161d;--line:rgba(239,230,210,.12);--line2:rgba(239,230,210,.22);--paper:#efe6d2;--dim:#a49b88;--faint:#6d6658;--red:#e8432e;--red2:#ff6a4d;--gold:#f2b544;--blue:#59b8ff;--violet:#b48cff;--jade:#4fd1a5;
--serif:'Shippori Mincho B1','Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif;--sans:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fin .28s ease-out both;overflow:auto;padding:24px}
@keyframes fin{from{opacity:0}to{opacity:1}}
.screen.dim{background:radial-gradient(120% 90% at 50% 35%,rgba(14,11,16,.72),rgba(6,5,8,.94))}
.screen.title{background:radial-gradient(80% 70% at 50% 40%,rgba(10,8,12,.1),rgba(6,5,8,.7))}
h1,h2,h3{font-family:var(--serif);font-weight:800;margin:0;letter-spacing:.02em}
h2{font-size:34px}
h3{font-size:16px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--sans);font-weight:700;color:var(--dim)}
h3 small{color:var(--faint);font-weight:500;margin-left:6px;letter-spacing:0}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
kbd{font-family:var(--sans);font-size:11px;padding:1px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;background:#1a1820;color:var(--paper)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:rgba(239,230,210,.04);border:1px solid var(--line2);padding:11px 20px;border-radius:3px;cursor:pointer;transition:all .14s;position:relative}
.btn:hover:not(:disabled){border-color:var(--red);background:rgba(232,67,46,.12);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#e8432e,#b42a1c);border-color:#ff7a5e;color:#fff6ee;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 30px -10px rgba(232,67,46,.7)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#ff5a40,#c8301f)}
.btn.big{font-size:16px;padding:14px 28px}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.small{font-size:11px;padding:7px 12px}
.panel{background:linear-gradient(180deg,rgba(24,21,28,.96),rgba(14,12,17,.96));border:1px solid var(--line);border-radius:6px;padding:30px 34px;max-width:980px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.panel.narrow{max-width:420px}
.tog{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.tog input{accent-color:var(--red);width:18px;height:18px}
.tog small{color:var(--faint)}
/* title */
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center}
.logo{position:relative}
.logo-k{font-family:var(--serif);font-weight:800;font-size:clamp(120px,18vw,220px);line-height:.9;color:rgba(232,67,46,.16);letter-spacing:-.04em;position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);white-space:nowrap;pointer-events:none}
.logo h1{position:relative;font-size:clamp(46px,7.5vw,92px);letter-spacing:.14em;color:#f6efe0;text-shadow:0 0 40px rgba(232,67,46,.35),0 4px 0 #000}
.logo h1::after{content:'';position:absolute;left:8%;right:8%;bottom:-10px;height:5px;background:linear-gradient(90deg,transparent,#e8432e 20%,#e8432e 80%,transparent);transform:skewX(-20deg)}
.tag{position:relative;margin:24px 0 0;color:var(--dim);font-size:15px;letter-spacing:.06em}
.menu{display:flex;flex-direction:column;gap:10px;min-width:280px}
.meta-row{display:flex;gap:26px;color:var(--dim);flex-wrap:wrap;justify-content:center}
.meta-row div{display:flex;flex-direction:column;align-items:center}
.meta-row b{font-family:var(--serif);font-size:24px;color:var(--paper)}
.meta-row span{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.foot{color:var(--faint);font-size:12px;letter-spacing:.08em}
/* how to */
.howto h2{margin-bottom:18px}
.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px 26px}
.howgrid h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:10px}
.howgrid h4 span{font-family:var(--serif);font-size:24px;color:var(--red)}
.howgrid p{margin:0 0 8px;color:#cfc6b4;font-size:13.5px;line-height:1.55}
.howgrid b{color:var(--paper)}
.howgrid .wide{grid-column:1/-1}
/* select */
.select-wrap{width:min(1180px,100%)}
.rushbtn{border-color:rgba(255,106,90,.45);color:#ffb0a0}.rushbtn small{color:var(--dim);font-weight:600;margin-left:6px}
.rush-wrap{width:min(1240px,100%)}
.rush-intro{color:var(--dim);max-width:820px;margin:4px auto 18px;text-align:center;line-height:1.5}
.gauntlets{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1050px){.gauntlets{grid-template-columns:repeat(2,1fr)}}
.gcard{background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 9%,var(--panel)),var(--panel) 45%);border:1px solid color-mix(in srgb,var(--gc) 35%,transparent);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.gcard.locked{opacity:.55;filter:saturate(.3)}
.gcard.done{box-shadow:0 0 0 1px color-mix(in srgb,var(--gc) 55%,transparent),0 12px 34px -16px var(--gc)}
.gtop{display:flex;gap:12px;align-items:flex-start}
.gk{font-family:var(--serif);font-size:44px;font-weight:800;color:var(--gc);line-height:1;text-shadow:0 0 22px color-mix(in srgb,var(--gc) 55%,transparent)}
.gn{font-weight:800;letter-spacing:.04em;margin-bottom:4px}
.gd{font-size:12.5px;color:var(--dim);line-height:1.4}
.glist{display:flex;flex-direction:column;gap:5px;flex:1}
.gboss{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.25);position:relative}
.gboss b{font-family:var(--serif);font-size:15px;color:var(--gc);text-align:center;white-space:nowrap;overflow:hidden}
.gboss span{font-size:13px;font-weight:700}
.gboss i{font-style:normal;color:var(--gold);font-size:10px;letter-spacing:-1px}
.gboss em{position:absolute;top:-6px;right:6px;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.08em;background:var(--gc);color:#140e08;padding:0 4px;border-radius:2px;text-transform:uppercase}
.gboss.beat{border-color:color-mix(in srgb,var(--gc) 40%,transparent)}
.gboss.can{cursor:pointer}.gboss.can:hover{background:color-mix(in srgb,var(--gc) 14%,transparent)}
.rushkit{font-size:12px;color:var(--dim);border:1px dashed var(--line2);border-radius:4px;padding:8px 10px;margin:10px 0}
.stars{color:var(--gold);font-size:11px;letter-spacing:-1px;margin-left:6px}
.blore{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.4;font-style:italic}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sgrid{display:grid;grid-template-columns:minmax(300px,1fr) 1.25fr;gap:22px}
@media (max-width:900px){.sgrid{grid-template-columns:1fr}}
.vessels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.vcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:16px 14px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .14s;min-height:74px}
.vcard b{font-family:var(--serif);font-size:34px;color:var(--vc);width:44px;text-align:center;text-shadow:0 0 18px color-mix(in srgb,var(--vc) 50%,transparent)}
.vcard span{font-weight:700;letter-spacing:.06em}
.vcard small{position:absolute;left:72px;bottom:8px;right:10px;font-size:10.5px;color:var(--faint);line-height:1.3}
.vcard:hover{border-color:var(--line2);transform:translateY(-1px)}
.vcard.on{border-color:var(--vc);background:linear-gradient(90deg,color-mix(in srgb,var(--vc) 14%,transparent),var(--panel) 70%)}
.vcard.locked{opacity:.5;cursor:not-allowed}
.vcard.locked b{color:var(--faint);text-shadow:none}
.vcard.locked span{position:relative;top:-8px}
.vdetail{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;padding:26px 28px;overflow:hidden}
.vbig{position:absolute;right:-10px;top:-30px;font-family:var(--serif);font-size:220px;font-weight:800;color:var(--vc);opacity:.08;line-height:1;pointer-events:none}
.vdetail h3{font-family:var(--serif);font-size:36px;color:var(--paper);text-transform:none;letter-spacing:.02em}
.vtitle{color:var(--vc);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:4px 0 14px}
.perks{margin:0 0 16px;padding-left:18px;color:#d6cdb9;line-height:1.6;font-size:14px}
.kit{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.kit-l{width:62px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.kit-r{flex:1;color:var(--dim);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bladechip{display:inline-block;padding:5px 10px;border:1px solid var(--r);border-radius:3px;color:var(--r);font-family:var(--serif);font-weight:800;font-size:14px;background:rgba(0,0,0,.25);cursor:help}
.danger{display:flex;gap:6px;align-items:center;margin:18px 0 18px}
.danger span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-right:8px}
.dbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--paper);font-family:var(--serif);font-weight:800;font-size:15px;cursor:pointer}
.dbtn.on{background:var(--red);border-color:#ff7a5e}
.dbtn:disabled{opacity:.25;cursor:not-allowed}
/* sigil chip */
.sig{position:relative;width:52px;height:52px;border-radius:5px;background:linear-gradient(180deg,#1d1a23,#131117);border:1px solid rgba(239,230,210,.14);display:flex;align-items:center;justify-content:center;cursor:grab;flex:none;transition:transform .1s,border-color .1s}
.sig::before{content:'';position:absolute;left:3px;right:3px;top:2px;height:3px;border-radius:2px}
.sig.t-proj::before{background:#ff5b45}.sig.t-mod::before{background:#59b8ff}.sig.t-multi::before{background:#f2b544}.sig.t-util::before{background:#4fd1a5}
.sig b{font-family:var(--serif);font-weight:800;font-size:26px;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent);margin-top:4px}
.sig i{position:absolute;left:4px;bottom:2px;font-style:normal;font-size:10px;color:#7fb8e8;font-weight:700}
.sig u{position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--r)}
.sig em{position:absolute;top:-7px;right:-6px;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.08em;background:var(--gold);color:#1a1206;padding:1px 4px;border-radius:2px;text-transform:uppercase}
.sig.empty{background:rgba(255,255,255,.015);border:1px dashed rgba(239,230,210,.14);cursor:default}
.sig.empty::before{display:none}
.sig:not(.empty):hover{border-color:var(--line2);transform:translateY(-2px)}
.chips .sig{width:40px;height:40px}.chips .sig b{font-size:20px}.chips .sig i{font-size:9px}
.sig.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%) scale(1.12) rotate(-4deg);box-shadow:0 14px 30px rgba(0,0,0,.6);border-color:var(--gold)}
.relic{position:relative;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--r);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1e1b24,#121016);cursor:help}
.relic b{font-family:var(--serif);font-weight:800;font-size:18px;color:var(--r)}
.relic i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:10px;font-weight:700;background:#000;border:1px solid var(--r);color:var(--r);border-radius:8px;padding:0 4px}
.none{color:var(--faint);font-size:13px}
/* level up */
.lv-wrap{text-align:center;max-width:1000px}
.lv-wrap h2{font-size:40px;margin-bottom:24px}
.lv-wrap h2 .k{color:var(--gold);margin-right:6px}
.ucards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.ucard{width:190px;min-height:220px;padding:20px 16px;border:1px solid color-mix(in srgb,var(--r) 55%,transparent);border-radius:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--r) 10%,#16141b),#121016);color:var(--paper);cursor:pointer;font-family:var(--sans);display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .14s;box-shadow:inset 0 3px 0 var(--r)}
.ucard:hover{transform:translateY(-4px);box-shadow:inset 0 3px 0 var(--r),0 16px 40px -14px color-mix(in srgb,var(--r) 70%,transparent);border-color:var(--r)}
.ug{font-family:var(--serif);font-size:56px;font-weight:800;color:var(--r);line-height:1.1;text-shadow:0 0 24px color-mix(in srgb,var(--r) 45%,transparent)}
.un{font-weight:700;font-size:16px;letter-spacing:.04em}
.uv{font-size:15px;color:#e6dcc6}
.ud{font-size:13px;color:#cfc6b4;line-height:1.45;flex:1}
.ur{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--r);margin-top:auto}
.relicc{width:230px;min-height:260px}
.ashnote{color:#ffb35a;font-family:var(--serif);font-weight:800}
/* forge */
.forge-screen{background:rgba(7,6,9,.96);align-items:flex-start;padding:18px 22px}
.forge{width:min(1360px,100%);margin:0 auto}
.fhead{display:flex;align-items:center;gap:24px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.fhead h2{font-size:32px}
.fhead-r{margin-left:auto;display:flex;gap:10px}
.ashbox{display:flex;align-items:baseline;gap:8px;padding:6px 16px;border:1px solid rgba(255,179,90,.3);border-radius:4px;background:rgba(255,179,90,.06)}
.ashbox .k{font-family:var(--serif);font-weight:800;color:#ffb35a;font-size:22px}
.ashbox b{font-family:var(--serif);font-size:28px;color:#ffe3b0}
.fgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
@media (max-width:1050px){.fgrid{grid-template-columns:1fr}}
.fleft,.fright{display:flex;flex-direction:column;gap:10px;min-width:0}
.bladecard{display:flex;gap:14px;align-items:center;padding:12px 16px;border:1px solid color-mix(in srgb,var(--r) 45%,transparent);border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--r) 8%,#141218),#121016)}
.bc-g{font-family:var(--serif);font-weight:800;font-size:38px;color:var(--r)}
.bc-n{font-family:var(--serif);font-weight:800;font-size:20px}
.bc-n small{font-family:var(--sans);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--r);margin-left:8px}
.bc-s{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:4px}
.bc-s b,.tt-stats b{color:var(--paper)}
.chain,.satchel{display:flex;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:rgba(18,16,22,.85)}
.chain.gold{border-color:rgba(242,181,68,.25)}.chain.jade{border-color:rgba(79,209,165,.22)}
.satchel{flex-wrap:wrap}
.ch-l{width:132px;flex:none}
.ch-t{font-family:var(--serif);font-weight:800;font-size:19px}
.chain.gold .ch-t{color:#f2c56a}.chain.jade .ch-t{color:#6fe0b8}
.ch-s{font-size:11px;color:var(--faint);line-height:1.35;margin-top:2px}
.ch-s b{color:var(--paper)}
.slots{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.slot{border-radius:6px;padding:2px;transition:background .1s}
.slot.sel .sig{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,181,68,.4),0 0 18px rgba(242,181,68,.35)}
.slot.over{background:rgba(242,181,68,.22)}
.slot.lifting .sig{opacity:.25}
.slot.add .sig{border-style:dotted}
.sellzone{flex-basis:100%;margin-top:4px;padding:8px;border:1px dashed rgba(255,179,90,.25);border-radius:4px;text-align:center;font-size:12px;color:var(--faint);letter-spacing:.06em;cursor:pointer}
.sellzone.armed{color:#ffb35a;border-color:rgba(255,179,90,.6);background:rgba(255,179,90,.06)}
.sellzone.over{background:rgba(255,179,90,.18)}
.preview{padding:8px 12px 8px 158px;font-size:12.5px;color:#cfc6b4;margin-top:-6px}
.preview .pv-t{display:none}
.preview ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.preview li{display:flex;gap:10px;align-items:baseline}
.preview .pn{width:18px;flex:none;color:var(--faint);font-family:var(--serif);font-weight:800;text-align:center}
.preview li.fin .pn{color:var(--red)}
.preview .pd{flex:1;line-height:1.4}
.preview .pc{color:#6fa8d8;font-size:11px;white-space:nowrap}
.preview.mini{padding-top:0;color:#a8a090;font-size:12px}
.shop,.box{border:1px solid var(--line);border-radius:5px;background:rgba(18,16,22,.85);padding:12px 14px}
.shop-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.offers{display:flex;flex-direction:column;gap:7px}
.offer{display:flex;gap:12px;align-items:center;padding:9px 10px;border:1px solid color-mix(in srgb,var(--r) 35%,transparent);border-left:3px solid var(--r);border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--r) 7%,#16141b),#131117);transition:transform .12s}
.offer:hover{transform:translateX(2px)}
.offer.locked{box-shadow:0 0 0 1px rgba(242,181,68,.5) inset}
.offer.sold{justify-content:center;opacity:.35;border-style:dashed;min-height:64px;border-left-width:1px}
.of-g{font-family:var(--serif);font-weight:800;font-size:32px;width:44px;text-align:center;color:var(--c);flex:none}
.of-m{flex:1;min-width:0}
.of-n{font-weight:700;font-size:14.5px}
.of-s{font-size:11px;color:var(--faint);margin:1px 0 3px;letter-spacing:.04em}
.of-d{font-size:12px;color:#cfc6b4;line-height:1.35}
.of-a{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.btn.buy{padding:8px 12px;font-family:var(--serif);font-size:15px;letter-spacing:.02em;color:#ffe3b0;border-color:rgba(255,179,90,.45);background:rgba(255,179,90,.08)}
.btn.buy.poor{opacity:.45}
.lockb{background:none;border:1px solid var(--line);color:var(--faint);border-radius:3px;cursor:pointer;font-family:var(--serif);font-size:13px;padding:2px 0}
.lockb.on{color:var(--gold);border-color:var(--gold)}
.relic-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 16px;margin-top:10px;font-size:12.5px}
.stats-grid div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(239,230,210,.06);padding:3px 0}
.stats-grid span{color:var(--dim)}
.pathbox{border:1px solid rgba(242,181,68,.35);border-radius:5px;background:linear-gradient(180deg,rgba(242,181,68,.07),rgba(18,16,22,.9));padding:12px 14px}
.pathbox h3{color:#f2c56a;margin-bottom:10px}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.path{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--line2);border-radius:5px;background:#16141b;color:var(--paper);cursor:pointer;font-family:var(--sans);transition:all .14s}
.path:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 10px 30px -12px rgba(242,181,68,.6)}

<script>
'use strict';
// ================= UTILITIES =================
const TAU = Math.PI * 2;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
const turnToward = (a, b, max) => a + clamp(angDiff(a, b), -max, max);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
function weighted(items, wf) { let tot = 0; for (const it of items) tot += wf(it); let r = Math.random() * tot; for (const it of items) { r -= wf(it); if (r <= 0) return it; } return items[items.length - 1]; }
const Store = {
  get(k, d) { try { const v = localStorage.getItem('sigilblade_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sigilblade_' + k, JSON.stringify(v)); } catch (e) { } }
};

// ================= GLOW SPRITES =================
const _glow = new Map();
function glowTex(col) {
  let c = _glow.get(col); if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, hexA(col, 1)); gr.addColorStop(0.2, hexA(col, 0.6)); gr.addColorStop(0.5, hexA(col, 0.16)); gr.addColorStop(1, hexA(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); _glow.set(col, c); return c;
}
function drawGlow(ctx, x, y, r, col, a = 1) { if (a <= 0 || r <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glowTex(col), x - r, y - r, r * 2, r * 2); }

// ================= AUDIO =================
const AudioSys = {
  ctx: null, master: null, sfx: null, mus: null, rev: null, noiseBuf: null,
  sfxOn: Store.get('sfx', true), musicOn: Store.get('music', true), last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.18;
      comp.connect(c.destination);
      this.master = c.createGain(); this.master.gain.value = 0.75; this.master.connect(comp);
      this.sfx = c.createGain(); this.sfx.gain.value = this.sfxOn ? 0.9 : 0; this.sfx.connect(this.master);
      this.mus = c.createGain(); this.mus.gain.value = this.musicOn ? 0.34 : 0; this.mus.connect(this.master);
      const conv = c.createConvolver(); const len = Math.floor(c.sampleRate * 1.9); const ir = c.createBuffer(2, len, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
      conv.buffer = ir; this.rev = c.createGain(); this.rev.gain.value = 0.3; this.rev.connect(conv); conv.connect(this.master);
      const nb = c.createBuffer(1, c.sampleRate, c.sampleRate); const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1; this.noiseBuf = nb;

    } catch (e) { this.ctx = null; }
  },
  setSfx(on) { this.sfxOn = on; Store.set('sfx', on); if (this.sfx) this.sfx.gain.value = on ? 0.9 : 0; },
  setMusic(on) { this.musicOn = on; Store.set('music', on); if (this.mus) this.mus.gain.value = on ? 0.34 : 0; },
  ok(name, gap) { if (!this.ctx || !this.sfxOn) return false; const now = this.ctx.currentTime; if (this.last[name] && now - this.last[name] < gap) return false; this.last[name] = now; return true; },
  osc({ type = 'sine', f = 440, f2 = 0, t = 0.2, v = 0.2, a = 0.004, delay = 0, rev = 0, filt = 0, fq = 1, ft = 'lowpass', out }) {
    const c = this.ctx, t0 = c.currentTime + Math.max(0, delay);
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t0 + t);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    let node = o; if (filt) { const bq = c.createBiquadFilter(); bq.type = ft; bq.frequency.value = filt; bq.Q.value = fq; o.connect(bq); node = bq; }
    node.connect(g); g.connect(out || this.sfx);
    if (rev) { const rg = c.createGain(); rg.gain.value = rev; g.connect(rg); rg.connect(this.rev); }
    o.start(t0); o.stop(t0 + t + 0.05);
  },
  noise({ t = 0.2, v = 0.2, f = 1000, f2 = 0, q = 1, type = 'bandpass', a = 0.003, delay = 0, rev = 0, out }) {
    const c = this.ctx, t0 = c.currentTime + Math.max(0, delay);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const bq = c.createBiquadFilter(); bq.type = type; bq.frequency.setValueAtTime(f, t0); if (f2) bq.frequency.exponentialRampToValueAtTime(f2, t0 + t); bq.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);

  },
  play(name, p = 1) { const fn = SFX[name]; if (fn && this.ctx && this.sfxOn && this.ctx.state === 'running') { try { fn(this, p); } catch (e) { } } }

const SFX = {
  swing(A, p = 1) { if (!A.ok('swing', 0.03)) return; A.noise({ t: 0.14, v: 0.16 * p, f: 2600, f2: 700, q: 0.9 }); },
  heavy(A) { if (!A.ok('heavy', 0.05)) return; A.noise({ t: 0.24, v: 0.26, f: 1800, f2: 280, q: 0.7 }); A.osc({ type: 'sine', f: 130, f2: 48, t: 0.2, v: 0.2 }); },

  tick(A) { if (!A.ok('tick', 0.035)) return; A.osc({ type: 'triangle', f: 900 * rand(0.9, 1.1), f2: 300, t: 0.05, v: 0.05 }); },

const Music = {
  timer: null, step: 0, next: 0, bpm: 96, intensity: 0, target: 0, idx: 3,
  scale: [0, 1, 5, 7, 8, 12, 13, 17, 19, 20, 24],
  start() { if (this.timer || !AudioSys.ctx) return; this.next = AudioSys.ctx.currentTime + 0.1; this.timer = setInterval(() => this.tick(), 25); },
  tick() {
    const A = AudioSys, c = A.ctx; if (!c || c.state !== 'running') return;
    if (!A.musicOn) { this.next = c.currentTime + 0.1; return; }
    const spb = 60 / this.bpm / 4; this.intensity += (this.target - this.intensity) * 0.03;
    if (this.next < c.currentTime - 0.2) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.15) { this.play(this.step, this.next - c.currentTime); this.next += spb; this.step = (this.step + 1) % 64; }
  },
  play(s, d) {
    const A = AudioSys, o = A.mus, I = this.intensity, b = s % 16;
    if (s % 32 === 0) { A.osc({ type: 'sine', f: 73.42, t: 5.5, v: 0.07, a: 1.2, delay: d, out: o }); A.osc({ type: 'sine', f: 110, t: 4.5, v: 0.03, a: 1.5, delay: d, out: o }); }
    if (I > 0.15) {
      if (b === 0 || b === 10) A.osc({ type: 'sine', f: 120, f2: 45, t: 0.4, v: 0.42 * I, delay: d, out: o });
      if (b === 8) A.osc({ type: 'sine', f: 180, f2: 85, t: 0.22, v: 0.26 * I, delay: d, out: o });
      if (I > 0.6 && (b === 3 || b === 6 || b === 14)) A.osc({ type: 'sine', f: 150, f2: 70, t: 0.18, v: 0.2 * I, delay: d, out: o });
      if (b % 4 === 2) A.noise({ t: 0.04, v: 0.03 * I, f: 7000, type: 'highpass', delay: d, out: o });
      if (b === 4 || b === 12) A.noise({ t: 0.05, v: 0.05 * I, f: 1800, q: 3, delay: d, out: o });
    }
    const mel = I > 0.6 ? (b % 2 === 0 && Math.random() < 0.35) : (b % 4 === 0 && Math.random() < (I > 0.15 ? 0.42 : 0.28));
    if (mel) {
      this.idx = clamp(this.idx + randi(-2, 2), 0, this.scale.length - 1);
      const f = 146.83 * Math.pow(2, this.scale[this.idx] / 12);
      A.osc({ type: 'triangle', f, t: 0.9, v: 0.065, a: 0.003, delay: d, out: o, filt: 2200 });
      A.osc({ type: 'sine', f: f * 2.005, t: 0.5, v: 0.022, delay: d, out: o });
    }
  }
};

const Input = {
  held: {}, press: {}, mx: 0, my: 0,
  keymap: {
    KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
    KeyJ: 'attack', Space: 'guard', KeyK: 'guard', ShiftLeft: 'dash', ShiftRight: 'dash', KeyL: 'dash',
    KeyE: 'art', KeyQ: 'focus', KeyR: 'gourd', KeyF: 'gourd', KeyC: 'auto', Escape: 'pause', KeyP: 'pause', KeyM: 'mute'
  },
  down(a) { if (!this.held[a]) { this.held[a] = true; this.press[a] = G.clock; if (this.onPress) this.onPress(a); } },
  up(a) { this.held[a] = false; },
  isHeld(a) { return !!this.held[a]; },
  took(a, buf = 0.17) { const t = this.press[a]; if (t != null && G.clock - t <= buf) { this.press[a] = null; return true; } if (t != null && G.clock - t > buf) this.press[a] = null; return false; },
  clear() { this.held = {}; this.press = {}; },
  bind(canvas) {
    window.addEventListener('keydown', (e) => {
      const a = this.keymap[e.code]; if (!a) return;
      if (G.state === 'play' || a === 'pause') e.preventDefault();
      if (e.repeat) return; AudioSys.init(); this.down(a);
    });
    window.addEventListener('keyup', (e) => { const a = this.keymap[e.code]; if (a) this.up(a); });
    canvas.addEventListener('mousedown', (e) => { AudioSys.init(); if (e.button === 0) { e.preventDefault(); this.down('attack'); } });
    window.addEventListener('mouseup', (e) => { if (e.button === 0) this.up('attack'); });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('mousemove', (e) => { this.mx = e.clientX; this.my = e.clientY; });
    window.addEventListener('blur', () => { this.held = {}; if (G.state === 'play') UI.pause(); });
  }
};

          <p><kbd>Click</kbd> / <kbd>J</kbd> strike · <kbd>C</kbd> toggle auto-strike (swings by itself when a foe is in reach)</p>
          <p><kbd>Space</kbd> / <kbd>K</kbd> guard &amp; deflect · <kbd>Shift</kbd> / <kbd>L</kbd> dash</p>
          <p><kbd>Q</kbd> focus thrust · <kbd>E</kbd> art · <kbd>R</kbd> healing gourd · <kbd>Esc</kbd> pause · <kbd>M</kbd> music</p>
          <p>No right-click needed, so it plays fine on a trackpad.</p></div>
        <div><h4><span>弾</span>Read the ground, then parry</h4>
          <p>Every enemy attack paints its exact hit zone on the floor. It fills up, and the hit lands the instant it's full. If you're outside the zone, you're safe.</p>
          <p><b>Yellow</b> zones can be parried: tap <kbd>Space</kbd> as the edge flashes <b>white</b>. A parry staggers normal foes, cracks their posture, fires your Guard chain, and makes your next strike a <b>Riposte</b> crit. Holding Space blocks instead.</p></div>
        <div><h4><span>斬</span>Break &amp; deathblow</h4>
          <p>Fill a foe's yellow posture bar and it <b>breaks</b> (grey, red dot). Strike it for a <b>deathblow</b>: instant kill and bonus ash. Attacking a broken foe nearby lunges to it, but only once every second.</p>
          <p>Bosses need one deathblow per life. They hit hard, shrug off 30% of spell damage, and their posture is deep: plan on a long string of clean deflects per life. Bosses also have <b>Resolve</b> (a pale ward flickers): raw burst past a point is softened, so no build skips the fight. <b>Ripostes, counter-hits, reflected shots and hits on a broken boss always land in full</b>, and a boss under heavy fire presses its attack harder. Freeze and stun hold a boss only briefly, then it shakes them off for a few seconds. Empty a boss's health and it makes a <b>Last Stand</b>: its posture stops recovering and takes triple damage. Deflects and ripostes finish it fastest.</p>
          <p>Hits and parries build a <b>combo</b> for bonus damage. Getting hit resets it.</p></div>
        <div><h4><span>弾</span>Deflect, don't run</h4>
          <p>A <b>perfect deflect</b> stings the attacker, shoves nearby foes back and interrupts light ones, refunds Ki and dash time, and for a moment turns aside blows from <i>everyone else</i> too. Your next swing within 1.4s is a <b>riposte</b>: double damage, a guaranteed crit and heavy posture.</p>
          <p><b>Clash:</b> swing <i>into</i> a yellow blow just as it lands and your blades meet. It counts as a deflect (a little less posture), so you can stay on the attack and trade cuts with a boss instead of backing off to guard.</p>
          <p><b>Dashing costs 14 Ki.</b> Without the Ki it is a <b>winded</b> dash with no invulnerability, and you cannot deflect for a split second after any dash. Bosses and elites <b>read your dodge</b>: they hold the blow and strike where you land.</p>
          <p><b>Rally:</b> part of every wound (the amber segment) can be won back by hitting back quickly. Ki regenerates slowly on its own; landing blows, deflecting and deathblows refill it. Stop fighting and you are <b>Hunted</b>: Ki stops, foes hit harder and swarm you.</p></div>
        <div class="wide"><h4><span>刀</span>Forging the perfect blade</h4>
          <p>Every blade you find is <b>engraved</b> with random traits: Keen, Heavy, Wild (shuffled, +1 slot and draw), Echoing, Forked, Hungry (grows slots as you kill), <b>Bound</b> (always casts a sigil for free), Overflowing, Two-faced and more. Even your starting blade rolls one, and the Path you pick at the start cuts another.</p>
          <p>At the Forge, <b>Temper</b> the blade you have: hone extra slots, <b>Imprint</b> a sigil (select it first) so it is cast with every swing for free, or re-engrave it. Tempering stays with that blade: swap blades and you start over, so choose when to commit.</p>
          <p>Bosses are drawn from a larger pool each run and carry random <b>aspects</b> (Frenzied, Relentless, Echoing, Vampiric, Retinue, Thunderclap...). The Forge shows what is coming before you face it.</p></div>
        <div class="wide"><h4><span>鬼</span>Boss Rush &amp; reading bosses</h4>
          <p><b>Boss Rush</b> (from the title screen) is four gauntlets of duels with no waves in between, from the wandering Ronin to the Sword Saint. Each starts you with a kit and ash to spend at the Forge; every win gives a level, a sigil and more ash. Clear a gauntlet to open the next, and replay any beaten boss alone as a practice duel. Past wave 15 of a normal run, these demon-court bosses start turning up too.</p>
          <p><b>Blinks</b> flare a ring on the boss before it vanishes; a streak shows where it went, usually behind or beside you. Turn and deflect. <b>Flash-steps</b> draw a dashed line through you: the boss crosses it instantly and the cut lands a beat later along the line. <b>Lightning steps</b> are a red bolt to dodge, then a yellow cut from whoever steps out of it. A <b>Mikiri stance</b> (gold ring, 見切) punishes any blade that touches it, so wait for the draw or strike ready to deflect. Every boss has a short story on the Forge and Boss Rush screens that hints at how it fights.</p></div>
        <div><h4><span>型</span>Style rank</h4>
          <p>Fighting well climbs a rank from <b>D</b> to <b>剣聖 Kensei</b>. Every verb scores: deflects, ripostes, dash strikes, counter-hits, Mikiri, Focus Thrusts, deathblows. <b>Repeating one move scores less</b>, so mix them up.</p>
          <p>Higher ranks give bonus damage and extra ash. Getting hit drops you a rank (two if it was a red attack), and blocking instead of deflecting bleeds the meter.</p></div>
        <div><h4><span>閃</span>Glints, counters &amp; Flawless</h4>
          <p>A <b>white glint</b> flashes on an attacker right before a deflectable blow lands. Press deflect on the glint. A <b>red</b> glint means dodge.</p>
          <p>Hit a foe <i>during</i> its wind-up for a <b>counter-hit</b>: bonus damage and posture, and finishers or dash strikes knock light foes out of the attack. Deflect <b>every hit</b> of an elite's or boss's string for a <b>Flawless</b>: big posture damage, a Focus pip, and a long opening. Chained deflects hit harder each time.</p></div>
        <div><h4><span>眼</span>Focus &amp; weak points</h4>
          <p>Parries, Mikiri and deathblows charge <b>Focus</b> (gold pips). When a foe shows a gold <b>weak point</b> (after you parry it, or after it whiffs a big attack), press <kbd>Q</kbd> to <b>Focus Thrust</b>: you lunge through it for massive damage and posture. Thrusting without a weak point still lunges, but hits far softer.</p>
          <p><b>Dash, then strike</b> for a wide dash strike. Striking near a broken foe lunges you into the deathblow.</p></div>
        <div><h4><span>危</span>Red means move</h4>
          <p><b>Red</b> zones marked <b>!</b> can't be parried. <b>Dash (Shift)</b> out of them, or through them at the last moment for a <b>Mikiri</b> counter.</p></div>
        <div><h4><span>印</span>Sigil chains</h4>
          <p>Your blade holds a <b>Strike chain</b>. Each swing <b>draws</b> the next sigil(s) and casts them. <b>Modifiers</b> boost every projectile in the same cast, <b>Multicasts</b> draw more, <b>Triggers</b> cast the next sigil where they hit. The last cast in a cycle is a heavy <b>finisher</b>.</p>
          <p>The <b>Guard chain</b> fires in full on every deflect (free). The <b>Art chain</b> fires in full on <kbd>E</kbd> (costs Ki, has a cooldown).</p></div>
        <div class="wide"><h4><span>共</span>Schools &amp; Resonance</h4>
          <p>Almost every sigil, relic and blade belongs to one of six <b>Schools</b>: ${SCHOOL_IDS.map(k => schoolPill(k)).join(' ')}. Neutral "ink" sigils (multicasts, Alpha/Omega) shape the others.</p>
          <p><b>Power:</b> each school has a power stat. Every point adds flat damage to that school's sigils (fast multi-hit sigils get less per hit), and Steel power also sharpens your sword. Level-ups offer power for the schools you use, and each basic stat card also grants +1 power in its school.</p>
          <p><b>Resonance:</b> count the sigils you have <i>equipped</i> in chains, plus your relics, blade, vessel and Attunements. At <b>2 / 4 / 6</b> of one school you unlock its passives (hover a school in the Forge). Two schools at II, or one at III: both work.</p></div>
        <div><h4><span>灰</span>The Run</h4>
          <p>Clear 15 waves. A wave ends when you cut down its <b>quota</b> of foes (the ring at the top); running out the clock does nothing. Past par time the survivors <b>frenzy</b>, and if you stop landing blows they grow bold and press harder. Dashes recharge faster while you hit, deflect and deathblow, and every deathblow heals a little.</p>
          <p>Ash dropped by foes is your XP and currency. Between waves the <b>Forge</b> sells sigils, relics and blades, and you <b>choose your path</b>: a risk for a reward. Two possible bosses guard each of waves 5, 10 and 15, then Endless begins. Elites carry modifiers like Warded, Volatile or Twinned.</p></div>
      </div>
      <div class="row"><button class="btn primary" data-a="back">Got it</button></div></div>`, 'dim');
    el.querySelector('[data-a=back]').onclick = back;
  },

  // ---------- VESSEL SELECT ----------
  showSelect(mode = null) {
    G.state = 'select'; let chosen = Store.get('lastVessel', 'ronin'); if (!VESSEL[chosen] || !isUnlocked(VESSEL[chosen])) chosen = 'ronin';
    let danger = Math.min(Store.get('lastDanger', 0), G.meta.maxDanger);
    const render = () => {
      const V = VESSEL[chosen]; const B = BLADES[V.blade];
      const el = this.screen(`<div class="select-wrap">
        <header class="shead"><button class="btn ghost" data-a="back">← Back</button><h2>${mode ? (mode.single ? 'Practice Duel · ' + BOSSES[mode.single].name : GAUNTLETS[mode.rush].name) : 'Choose a Vessel'}</h2><span></span></header>
        <div class="sgrid">
          <div class="vessels">${VESSELS.map(v => { const u = isUnlocked(v); return `<div class="vcard ${v.id === chosen ? 'on' : ''} ${u ? '' : 'locked'}" data-v="${v.id}" style="--vc:${v.col}"><b>${u ? v.g : '鎖'}</b><span>${u ? v.name : '???'}</span>${u ? '' : `<small>${esc(v.unlock.text)}</small>`}</div>`; }).join('')}</div>
          <div class="vdetail" style="--vc:${V.col}">
            <div class="vbig">${V.g}</div>
            <h3>${V.name}</h3><div class="vtitle">${V.title}</div>
            <ul class="perks">${V.perks.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
            ${V.random ? '' : (() => { const r = computeResonance({ vessel: V.id, blade: V.blade, strike: V.strike, guard: V.guard, art: V.art, relics: V.relics || [], attune: {} }); const ks = SCHOOL_IDS.filter(k => r[k] > 0).sort((a, b) => r[b] - r[a]); return ks.length ? `<div class="kit"><div class="kit-l">Schools</div><div class="kit-r">${ks.map(k => schoolPill(k, ` ${r[k]}${resTier(r[k]) ? ' · ' + ROMAN[resTier(r[k])] : ''}`)).join('')}</div></div>` : ''; })()}
            ${V.random ? '<div class="kit"><div class="kit-l">Kit</div><div class="kit-r">Rolled at the start of the run.</div></div>' : `
            <div class="kit"><div class="kit-l">Blade</div><div class="kit-r"><span class="bladechip" data-tip="blade:${B.id}" style="--r:${RAR[B.rar].col}">刀 ${B.name}</span></div></div>
            <div class="kit"><div class="kit-l">Strike</div><div class="kit-r chips">${V.strike.map(id => sigChip(id)).join('')}</div></div>
            <div class="kit"><div class="kit-l">Guard</div><div class="kit-r chips">${V.guard.map(id => sigChip(id)).join('')}</div></div>
            <div class="kit"><div class="kit-l">Art</div><div class="kit-r chips">${V.art.map(id => sigChip(id)).join('')}</div></div>
            ${V.satchel.length ? `<div class="kit"><div class="kit-l">Satchel</div><div class="kit-r chips">${V.satchel.map(id => sigChip(id)).join('')}</div></div>` : ''}
            ${(V.relics || []).length ? `<div class="kit"><div class="kit-l">Relics</div><div class="kit-r chips">${V.relics.map(id => relicChip(id)).join('')}</div></div>` : ''}`}
            <div class="danger"><span>Danger</span>${[0, 1, 2, 3, 4, 5].map(d => `<button class="dbtn ${d === danger ? 'on' : ''}" data-d="${d}" ${d > G.meta.maxDanger ? 'disabled' : ''} data-tip="txt:${esc(DANGER_TXT[d])}">${d}</button>`).join('')}</div>
            ${mode ? `<div class="rushkit">Boss Rush kit: Lv ${GAUNTLETS[mode.rush].kit.level} · ${GAUNTLETS[mode.rush].kit.picks} level picks · ${GAUNTLETS[mode.rush].kit.sigils} sigil picks · a blade pick · ${GAUNTLETS[mode.rush].kit.ash} 灰 to spend at the Forge before the first duel</div>` : ''}
            <button class="btn primary big" data-a="start">${mode ? (mode.single ? 'Begin the Duel' : 'Enter the Gauntlet') : 'Enter the Courtyard'}</button>
          </div>
        </div></div>`, 'dim');
      el.querySelector('[data-a=back]').onclick = () => mode ? this.showRush() : this.showTitle();
      el.querySelectorAll('.vcard').forEach(c => c.onclick = () => { const v = VESSEL[c.dataset.v]; if (!isUnlocked(v)) { AudioSys.play('deny'); return; } chosen = v.id; AudioSys.play('ui'); render(); });
      el.querySelectorAll('.dbtn').forEach(b => b.onclick = () => { danger = +b.dataset.d; render(); });
      el.querySelector('[data-a=start]').onclick = () => { AudioSys.init(); Store.set('lastVessel', chosen); Store.set('lastDanger', danger); this.lastPick = { v: chosen, d: danger, mode }; newRun(chosen, danger, mode || {}); };
    };
    render();
  },

  showRush() {
    G.state = 'select'; const M = G.meta; const beatAll = M.rushBeat || {};
    const el = this.screen(`<div class="rush-wrap">
      <header class="shead"><button class="btn ghost" data-a="back">← Back</button><h2>Boss Rush</h2><span></span></header>
      <p class="rush-intro">Duel after duel, no waves in between. Each gauntlet hands you a kit to spend at the Forge, then rewards every victory with a level, a sigil and ash, so tune your blade for single, deadly foes. Clear a gauntlet to open the next. Any boss you have beaten can be fought again alone.</p>
      <div class="gauntlets">${GAUNTLETS.map((Gt, gi) => { const open = gi <= M.rushCleared + 1, done = gi <= M.rushCleared;
        return `<div class="gcard ${open ? '' : 'locked'} ${done ? 'done' : ''}" style="--gc:${Gt.col}">
          <div class="gtop"><div class="gk">${open ? Gt.g : '鎖'}</div><div><div class="gn">${['I', 'II', 'III', 'IV'][gi]} · ${Gt.name}</div><div class="gd">${open ? esc(Gt.desc) : 'Clear ' + esc(GAUNTLETS[gi - 1].name) + ' to open this gauntlet.'}</div></div></div>
          <div class="glist">${Gt.bosses.map(id => { const B = BOSSES[id], beat = !!beatAll[id]; return `<div class="gboss ${beat ? 'beat' : ''} ${open && beat ? 'can' : ''}" ${open && beat ? `data-duel="${id}" data-g="${gi}" data-tip="txt:${esc('Practice duel. ' + (B.lore || ''))}"` : (open ? `data-tip="txt:${esc(B.lore || '')}"` : '')}><b>${open ? B.g : '?'}</b><span>${open ? B.name : '???'}</span><i>${'★'.repeat(B.diff || 1)}</i>${beat ? '<em>duel</em>' : ''}</div>`; }).join('')}</div>
          <button class="btn ${open ? 'primary' : ''}" data-g="${gi}" ${open ? '' : 'disabled'}>${done ? 'Run it again' : open ? 'Begin the gauntlet' : 'Locked'}</button></div>`; }).join('')}</div></div>`, 'dim');
    el.querySelector('[data-a=back]').onclick = () => this.showTitle();
    el.querySelectorAll('button[data-g]').forEach(b => b.onclick = () => { AudioSys.play('ui'); this.showSelect({ rush: +b.dataset.g }); });
    el.querySelectorAll('[data-duel]').forEach(d => d.onclick = () => { AudioSys.play('ui'); this.showSelect({ rush: +d.dataset.g, single: d.dataset.duel }); });
  },

  // ---------- AFTER WAVE FLOW ----------
  afterWave() {
    G.state = 'menu'; G.banner = null; G.hint = null; canvas.style.cursor = 'default'; Input.clear();
    if (G.pendingLevels > 0) return this.showLevelUp();
    if (G.pendingChests.length) return this.showChest(G.pendingChests.shift());
    if (G.pendingSigilPicks > 0) return this.showSigilPick();
    if (G.pendingBladePicks > 0) return this.showBladePick();
    if (G.run.rush && G.wave >= G.run.rush.list.length) return this.showOver(true);
    if (G.wave === 15 && !G.run.endless && !G.run.rush) return this.showOver(true);
    this.showForge(true);
  },
  showLevelUp() {
    const lvl = G.level - G.pendingLevels + 1; let rerolls = 0;
    const roll = () => levelOffers(lvl);
    let offers = roll();
    const render = () => {
      const cost = 1 + Math.floor(G.wave / 2) + rerolls;
      const el = this.screen(`<div class="lv-wrap"><div class="eyebrow">Level ${lvl}${G.pendingLevels > 1 ? ` · ${G.pendingLevels - 1} more` : ''}</div><h2><span class="k">昇</span> Ascend</h2>
        <div class="ucards">${offers.map((o, i) => offerCardHTML(o, i)).join('')}</div>
        <div class="resmini">${SCHOOL_IDS.filter(k => resN(k) > 0).map(k => resRow(k)).join('')}</div>
        <div class="row"><button class="btn ghost" data-a="reroll" ${G.ash < cost ? 'disabled' : ''}>Reroll · ${cost} 灰</button><span class="ashnote">灰 ${G.ash}</span></div></div>`, 'dim');
      el.querySelectorAll('.ucard').forEach(b => b.onclick = () => {
        const o = offers[+b.dataset.i]; const R = G.run;
        if (o.kind === 'attune') R.attune[o.k] = (R.attune[o.k] || 0) + 1;
        else { R.ups[o.s.k] = (R.ups[o.s.k] || 0) + o.v; if (o.kind === 'stat' && o.s.aff) R.ups['pow.' + o.s.aff] = (R.ups['pow.' + o.s.aff] || 0) + 1; }
        recomputeStats(); this.resToasts(); G.pendingLevels--; AudioSys.play('level'); this.afterWave();
      });
      el.querySelector('[data-a=reroll]').onclick = () => { const c = 1 + Math.floor(G.wave / 2) + rerolls; if (G.ash < c) return; G.ash -= c; rerolls++; offers = roll(); render(); };
    };
    render();
  },
  showChest(minR) {
    const pool = RELIC_LIST.filter(r => !(r.unique && hasR(r.id)));
    const picks = []; let guard = 0;
    while (picks.length < 3 && guard++ < 100) { const t = rollRarity(G.wave + 4, G.S.luck, minR); const c = pool.filter(r => r.rar === t && !picks.includes(r)); if (c.length) picks.push(wpick(c)); }
    while (picks.length < 3) { const c = pool.filter(r => !picks.includes(r)); if (!c.length) break; picks.push(wpick(c)); }
    const skip = 6 + G.wave * 2;
    const el = this.screen(`<div class="lv-wrap"><div class="eyebrow">${minR >= 3 ? 'Spoils of the fallen' : 'Treasure found'}</div><h2><span class="k">宝</span> Choose a Relic</h2>
      <div class="ucards">${picks.map((r, i) => `<button class="ucard relicc" data-i="${i}" style="--r:${RAR[r.rar].col}"><div class="ug">${r.g}</div><div class="un">${r.name}</div>${r.school ? `<div class="usch">${schoolPill(r.school)}</div>` : ''}<div class="ud">${esc(r.desc)}</div>${fitLine(r.school)}<div class="ur">${RAR[r.rar].name}</div></button>`).join('')}</div>
      <div class="row"><button class="btn ghost" data-a="skip">Melt for ${skip} 灰</button></div></div>`, 'dim');
    el.querySelectorAll('.ucard').forEach(b => b.onclick = () => { const r = picks[+b.dataset.i]; G.run.relics.push(r.id); recomputeStats(); this.resToasts(); AudioSys.play('buy'); this.afterWave(); });
    el.querySelector('[data-a=skip]').onclick = () => { G.ash += skip; AudioSys.play('coin'); this.afterWave(); };
  },

  showSigilPick() {
    const picks = []; let guard = 0;
    while (picks.length < 3 && guard++ < 80) { const t = rollRarity(G.wave + 3, G.S.luck, 2); const c = SIG_LIST.filter(x => x.rar === t && !picks.includes(x)); if (c.length) picks.push(wpick(c)); }
    const el = this.screen(`<div class="lv-wrap"><div class="eyebrow">Sigil cache</div><h2><span class="k">印</span> Choose a Sigil</h2>
      <div class="ucards">${picks.map((x, i) => `<button class="ucard relicc" data-i="${i}" style="--r:${RAR[x.rar].col}"><div class="ug" style="color:${x.col}">${x.g}</div><div class="un">${x.name}</div><div class="ur" style="color:${TYPE_COL[x.type]}">${TYPE_NAME[x.type]} · ${x.hp ? x.hp + ' HP' : x.ki + ' Ki'}</div>${x.school ? `<div class="usch">${schoolPill(x.school)}</div>` : ''}<div class="ud">${esc(x.desc)}</div>${fitLine(x.school)}<div class="ur">${RAR[x.rar].name}</div></button>`).join('')}</div>
      <div class="row"><button class="btn ghost" data-a="skip">Skip</button></div></div>`, 'dim');
    const done = () => { G.pendingSigilPicks--; this.afterWave(); };
    el.querySelectorAll('.ucard').forEach(b => b.onclick = () => { const x = picks[+b.dataset.i]; const R = G.run; const e = R.strike.indexOf(null); if (e >= 0) R.strike[e] = x.id; else R.satchel.push(x.id); this.newSigils.add(x.id); recomputeStats(); this.resToasts(); AudioSys.play('buy'); done(); });
    el.querySelector('[data-a=skip]').onclick = done;
  },
  showBladePick() {
    const pool = BLADE_LIST.filter(b => b.id !== G.run.blade && b.rar >= 2); const picks = shuffleArr(pool.slice()).slice(0, 3).map(b => Object.assign({}, b, { eng: rollEngravings(b.rar) }));
    const el = this.screen(`<div class="lv-wrap"><div class="eyebrow">The challenger's armory</div><h2><span class="k">刀</span> Choose a Blade</h2>
      <div class="ucards">${picks.map((b, i) => `<button class="ucard relicc" data-i="${i}" style="--r:${RAR[b.rar].col}" data-tip="blade:${b.id}"><div class="ug">刀</div><div class="un">${b.name}</div>${b.school ? `<div class="usch">${schoolPill(b.school)}</div>` : ''}<div class="ud">${esc(b.desc)}<br><br>${b.slots} slots · draw ${b.draw} · reach ${b.reach}</div>${engList(b.eng)}${fitLine(b.school)}<div class="ur">${RAR[b.rar].name}</div></button>`).join('')}</div>
      <div class="row"><button class="btn ghost" data-a="skip">Keep my ${BLADES[G.run.blade].name}</button></div></div>`, 'dim');
    const done = () => { G.pendingBladePicks--; this.afterWave(); };
    el.querySelectorAll('.ucard').forEach(b => b.onclick = () => { const pk = picks[+b.dataset.i]; wieldBlade(pk.id, pk.eng); this.resToasts(); AudioSys.play('buy'); done(); });
    el.querySelector('[data-a=skip]').onclick = done;
  },
  // ---------- OPENING DRAFT: your build has a direction from the first swing ----------
  showBoon(cb) {
    const R = G.run; const ks = shuffleArr(SCHOOL_IDS.slice()).slice(0, 3); const boons = ks.map(rollBoon);
    const el = this.screen(`<div class="lv-wrap"><div class="eyebrow">Before the first wave · your blade: ${esc(BLADES[R.blade].name)}${(R.eng || []).length ? ' · ' + R.eng.map(engLabel).join(', ') : ''}</div><h2><span class="k">道</span> Choose your Path</h2>
      <p class="lv-sub">Each path seeds a build: two sigils, a relic, and an engraving cut into your blade.</p>

    const items = [...keep]; let guard = 0;

      <div class="row"><button class="btn primary" data-a="resume">Resume</button><button class="btn" data-a="howto">How to Play</button><button class="btn" data-a="settings">Settings</button><button class="btn ghost" data-a="quit">Abandon run</button></div></div>`, 'dim');
    el.querySelector('[data-a=resume]').onclick = () => this.resume();
    el.querySelector('[data-a=howto]').onclick = () => this.showHowTo(() => { G.state = 'play'; this.pause(); });
    el.querySelector('[data-a=settings]').onclick = () => this.showSettings(() => { G.state = 'play'; this.pause(); });
    const q = el.querySelector('[data-a=quit]'); let armed = false;
    q.onclick = () => { if (!armed) { armed = true; q.textContent = 'Click again to abandon'; return; } finishRun(false); this.showTitle(); };
  },
  resume() { if (G.state !== 'paused') return; this.hideAll(); G.state = 'play'; canvas.style.cursor = 'none'; Input.clear(); lastT = performance.now(); },

  // ---------- GAME OVER / VICTORY ----------
  showOver(win) {
    G.state = 'over'; canvas.style.cursor = 'default'; G.callouts = []; G.banner = null; G.hint = null;
    const R = G.run; const unlocked = finishRun(win || R.endless);
    const tm = Math.floor(R.time / 60) + ':' + String(Math.floor(R.time % 60)).padStart(2, '0');
    const counts = {}; R.relics.forEach(id => counts[id] = (counts[id] || 0) + 1);
    const el = this.screen(`<div class="over ${win ? 'win' : ''}">
      <div class="over-k">${win ? '勝' : '死'}</div>
      <h2>${R.rush ? (win ? (R.rush.single ? `${BOSSES[R.rush.list[0]].name} is beaten` : `${GAUNTLETS[R.rush.g].name} conquered`) : `Fell to ${BOSSES[bossFor(Math.max(1, G.wave))].name} · duel ${G.wave} of ${R.rush.list.length}`) : win ? 'The Hollow Shogun has fallen' : (R.endless ? `Fell in Endless · wave ${G.wave}` : `Fell on wave ${G.wave}`)}</h2>
      <div class="sub">${R.rush ? 'Boss Rush · ' : ''}${VESSEL[R.vessel].name} · Danger ${G.danger} · ${tm}</div>
      <div class="ostats">
        <div><b>${R.kills}</b><span>kills</span></div><div><b>${R.deflects}</b><span>deflects</span></div><div><b>${R.deathblows}</b><span>deathblows</span></div>
        <div><b>${R.mikiri}</b><span>mikiri</span></div><div><b style="color:${STYLE_RANKS[R.bestRank || 0].col}">${STYLE_RANKS[R.bestRank || 0].k}</b><span>best rank</span></div><div><b>${R.flawless || 0}</b><span>flawless</span></div><div><b>${Math.round(R.dmgDealt).toLocaleString()}</b><span>damage</span></div><div><b>${R.ashTotal}</b><span>ash</span></div>
      </div>
      <div class="obuild chips">${R.strike.filter(Boolean).map(id => sigChip(id)).join('')}<span class="sep"></span>${Object.keys(counts).map(id => relicChip(id, counts[id])).join('')}</div>
      ${unlocked.length ? `<div class="unlock">Unlocked: ${unlocked.map(v => `<b style="color:${v.col}">${v.g} ${v.name}</b>`).join(' · ')}</div>` : ''}
      ${win && !R.rush && G.meta.maxDanger > G.danger && G.danger < 5 ? `<div class="unlock">Danger ${G.danger + 1} unlocked</div>` : ''}
      ${R.rush && R.rushNew ? (GAUNTLETS[R.rush.g + 1] ? `<div class="unlock">Unlocked: <b style="color:${GAUNTLETS[R.rush.g + 1].col}">${GAUNTLETS[R.rush.g + 1].g} ${GAUNTLETS[R.rush.g + 1].name}</b></div>` : '<div class="unlock">Every gauntlet conquered. You are the Sword Saint now.</div>') : ''}
      <div class="row">
        ${win && !R.rush ? '<button class="btn primary big" data-a="endless">Continue into Endless</button>' : ''}${R.rush ? '<button class="btn primary big" data-a="rushmenu">Boss Rush</button>' : ''}
        <button class="btn ${win || R.rush ? '' : 'primary big'}" data-a="again">Run it back</button><button class="btn" data-a="select">Choose Vessel</button><button class="btn ghost" data-a="title">Title</button>
      </div></div>`, 'dim over-screen');
    if (win) AudioSys.play('win'); if (win && !R.rush) el.querySelector('[data-a=endless]').onclick = () => { R.endless = true; this.showForge(true); };
    if (R.rush) el.querySelector('[data-a=rushmenu]').onclick = () => this.showRush();
    el.querySelector('[data-a=again]').onclick = () => newRun(R.vessel, G.danger, R.rush ? { rush: R.rush.g, single: R.rush.single } : {});
    el.querySelector('[data-a=select]').onclick = () => this.showSelect();
    el.querySelector('[data-a=title]').onclick = () => this.showTitle();
  }
};
const DANGER_TXT = [
  'Danger 0 — the courtyard as intended.',
  'Danger 1 — foes +18% HP, +12% damage.',
  'Danger 2 — also: foes wind up 8% faster.',
  'Danger 3 — also: one more foe may attack you at once.',
  'Danger 4 — also: a second elite each wave.',
  'Danger 5 — everything above, at full strength.'
];

</script>
</body>
</html>
